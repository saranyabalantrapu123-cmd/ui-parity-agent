<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout &middot; Nimbus</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="app">
<header class="app-bar">
  <a class="app-bar__brand" href="/index.html">Nimbus</a>
  <span class="app-bar__title">Checkout</span>
  <a class="app-bar__icon" href="/support.html" aria-label="Support">Help</a>
  <a class="app-bar__icon" href="/bag.html" aria-label="Bag">Bag</a>
</header>
<main>
<h1>Checkout</h1>
<section class="panel" aria-label="Order summary">
  <h2>Order summary</h2>
  <div class="summary-row"><span>Nimbus X15</span><strong>$799.00</strong></div>
</section>
<section class="panel" aria-label="Shipping and payment">
  <form aria-label="Checkout form" action="/order-confirmation.html" method="get">
    <label for="name">Full name</label>
    <input id="name" name="name" required>
    <label for="address">Shipping address</label>
    <input id="address" name="address" required>
    <label for="card">Card number</label>
    <input id="card" name="card" inputmode="numeric" required>
    <button type="submit" class="btn btn-primary">Place Order</button>
  </form>
</section>
</main>
<nav class="tab-bar" aria-label="Tabs">
  <a href="/index.html"><span class="dot"></span>Home</a>
  <a href="/devices.html"><span class="dot"></span>Devices</a>
  <a href="/plans.html"><span class="dot"></span>Plans</a>
  <a href="/billing.html"><span class="dot"></span>Billing</a>
  <a href="/profile.html"><span class="dot"></span>Profile</a>
</nav>
<div class="chat-launcher" id="nimbus-assistant" aria-label="Nimbus Assistant">
  <div class="chat-window" hidden>
    <div class="chat-window__head">Nova &middot; Nimbus Assistant</div>
    <p class="chat-window__msg">Hi, I'm Nova. Ask me about plans, bills, or devices.</p>
  </div>
  <button type="button" class="chat-launcher__btn" aria-expanded="false">Ask Nova</button>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
